<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTX — Jellyfin Text Browser</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg-alt: #16213e;
  --bg-row-hover: #0f3460;
  --bg-expanded: #1a1a3e;
  --text: #e0e0e0;
  --text-dim: #8888aa;
  --text-bright: #ffffff;
  --accent: #e94560;
  --accent-dim: #a33347;
  --border: #2a2a4a;
  --input-bg: #0f0f23;
  --input-border: #3a3a5a;
  --sort-active: #e94560;
  --font: "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

#app {
  max-width: 1600px;
  margin: 0 auto;
  padding: 12px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.header h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-bright);
}

.header h1 span { color: var(--accent); }

.stats {
  color: var(--text-dim);
  font-size: 12px;
}

/* Filters */
.filters {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
  align-items: end;
}

.filter-group label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.filter-group input,
.filter-group select {
  width: 100%;
  padding: 6px 8px;
  font-family: var(--font);
  font-size: 13px;
  background: var(--input-bg);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 3px;
  outline: none;
}

.filter-group input:focus,
.filter-group select:focus {
  border-color: var(--accent);
}

.filter-group select { cursor: pointer; }
.filter-group select option { background: var(--input-bg); }

/* Table */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

/* Column widths */
col.c-thumb    { width: 50px; }
col.c-title    { width: 26%; }
col.c-year     { width: 6%; }
col.c-director { width: 14%; }
col.c-genre    { width: 12%; }
col.c-rating   { width: 6%; }
col.c-runtime  { width: 6%; }
col.c-res      { width: 7%; }
col.c-audio    { width: 7%; }
col.c-codec    { width: 7%; }
col.c-size     { width: 7%; }

/* Thumbnail */
td.thumb-cell {
  padding: 2px 4px;
  width: 50px;
  position: relative;
  cursor: pointer;
  vertical-align: middle;
}

td.thumb-cell img {
  height: calc(1em * 1.5 * 1.25); /* font line-height + 25% */
  width: auto;
  border-radius: 2px;
  display: block;
  object-fit: cover;
}

th.th-thumb {
  width: 50px;
  cursor: default !important;
}

/* Hover Card */
.hover-card {
  display: none;
  position: fixed;
  z-index: 100;
  width: 420px;
  max-height: 320px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  overflow: hidden;
  pointer-events: none;
}

.hover-card.visible {
  display: flex;
  pointer-events: auto;
}

.hover-card.enlarged {
  width: 620px;
  max-height: 460px;
}

.hover-card-poster {
  flex-shrink: 0;
  width: 140px;
  background: var(--bg);
}

.hover-card.enlarged .hover-card-poster {
  width: 200px;
}

.hover-card-poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hover-card-body {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  min-width: 0;
}

.hover-card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-bright);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hover-card-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.hover-card-rt {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 3px;
  margin-bottom: 6px;
}

.hover-card-rt.fresh { background: #4a7c3f; color: #c8f7c0; }
.hover-card-rt.rotten { background: #7c3f3f; color: #f7c0c0; }

.hover-card-genres {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}

.hover-card-genres span {
  font-size: 10px;
  padding: 1px 6px;
  background: rgba(233,69,96,0.15);
  color: var(--accent);
  border-radius: 10px;
}

.hover-card-blurb {
  font-size: 12px;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 6px;
}

.hover-card-people {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.4;
}

.hover-card-enlarge {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 24px;
  height: 24px;
  background: rgba(0,0,0,0.6);
  border: none;
  border-radius: 3px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

.hover-card-enlarge:hover { color: var(--text-bright); }

thead th {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg-alt);
  padding: 8px 6px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  border-bottom: 2px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}

thead th:hover { color: var(--text-bright); }

thead th.sort-asc,
thead th.sort-desc {
  color: var(--sort-active);
}

thead th.sort-asc::after { content: " ▲"; font-size: 9px; }
thead th.sort-desc::after { content: " ▼"; font-size: 9px; }

tbody tr {
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
}

tbody tr:hover { background: var(--bg-row-hover); }
tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
tbody tr:nth-child(even):hover { background: var(--bg-row-hover); }

td {
  padding: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: top;
}

td.title-cell {
  color: var(--text-bright);
  font-weight: 500;
}

td.rating-cell {
  font-weight: 600;
}

/* Expanded detail row */
tr.detail-row td {
  padding: 12px 16px;
  white-space: normal;
  background: var(--bg-expanded);
  border-bottom: 2px solid var(--accent-dim);
  cursor: default;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.detail-section h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent);
  margin-bottom: 4px;
}

.detail-section p,
.detail-section ul {
  font-size: 12px;
  color: var(--text);
  line-height: 1.6;
}

.detail-section ul {
  list-style: none;
  padding: 0;
}

.detail-section ul li::before {
  content: "· ";
  color: var(--accent);
}

.play-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 16px;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-bright);
  background: var(--accent);
  border: none;
  border-radius: 3px;
  cursor: pointer;
  text-decoration: none;
}

.play-btn:hover { background: #ff5a75; }

/* Rating colors */
.rating-high { color: #4ade80; }
.rating-mid  { color: #fbbf24; }
.rating-low  { color: #f87171; }

/* Loading / Error */
.status-msg {
  text-align: center;
  padding: 40px;
  color: var(--text-dim);
}

.status-msg.error { color: var(--accent); }

/* Mobile */
@media (max-width: 900px) {
  .filters {
    grid-template-columns: 1fr 1fr;
  }
  col.c-director, col.c-codec, col.c-size { width: 0; display: none; }
  td:nth-child(4), th:nth-child(4),
  td:nth-child(10), th:nth-child(10),
  td:nth-child(11), th:nth-child(11) { display: none; }
}

@media (max-width: 600px) {
  .filters { grid-template-columns: 1fr; }
  body { font-size: 12px; }
  col.c-audio { width: 0; display: none; }
  td:nth-child(9), th:nth-child(9) { display: none; }
  td.thumb-cell img { height: calc(1em * 1.25); }
}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1><span>JTX</span> — Jellyfin Text Browser</h1>
    <div class="stats" id="stats">Loading...</div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label>Search (title, director, cast)</label>
      <input type="text" id="f-search" placeholder="Type to search...">
    </div>
    <div class="filter-group">
      <label>Genre</label>
      <select id="f-genre"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label>Year (min)</label>
      <input type="number" id="f-year-min" placeholder="1920">
    </div>
    <div class="filter-group">
      <label>Year (max)</label>
      <input type="number" id="f-year-max" placeholder="2026">
    </div>
    <div class="filter-group">
      <label>Rating ≥</label>
      <input type="number" id="f-rating" placeholder="0" step="0.5" min="0" max="10">
    </div>
    <div class="filter-group">
      <label>Resolution</label>
      <select id="f-res">
        <option value="">All</option>
        <option value="4k">4K (2160p)</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="sd">SD (&lt;720p)</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="c-thumb">
        <col class="c-title">
        <col class="c-year">
        <col class="c-director">
        <col class="c-genre">
        <col class="c-rating">
        <col class="c-runtime">
        <col class="c-res">
        <col class="c-audio">
        <col class="c-codec">
        <col class="c-size">
      </colgroup>
      <thead>
        <tr>
          <th class="th-thumb"></th>
          <th data-col="title" class="sort-asc">Title</th>
          <th data-col="year">Year</th>
          <th data-col="director">Director</th>
          <th data-col="genre">Genre</th>
          <th data-col="rating">Rating</th>
          <th data-col="runtime">Min</th>
          <th data-col="res">Res</th>
          <th data-col="audio">Audio</th>
          <th data-col="codec">Codec</th>
          <th data-col="size">Size</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="11" class="status-msg">Loading library...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Hover Card -->
  <div class="hover-card" id="hover-card">
    <div class="hover-card-poster">
      <img id="hc-poster" src="" alt="">
    </div>
    <div class="hover-card-body">
      <div class="hover-card-title" id="hc-title"></div>
      <div class="hover-card-meta" id="hc-meta"></div>
      <span class="hover-card-rt" id="hc-rt"></span>
      <div class="hover-card-genres" id="hc-genres"></div>
      <div class="hover-card-blurb" id="hc-blurb"></div>
      <div class="hover-card-people" id="hc-people"></div>
    </div>
    <button class="hover-card-enlarge" id="hc-enlarge" title="Enlarge">⤢</button>
  </div>
</div>

<script>
// ============================================================
// JTX — Jellyfin Text Browser
// Single-file application — no dependencies, no build step
// ============================================================

// --- CONFIGURATION ---
const CONFIG = {
  serverUrl: window.location.hostname === 'localhost'
    ? 'http://192.168.1.183:8096'
    : 'http://192.168.1.183:8096',
  apiKey: 'b62806a76e91466fa5964648d545a446',
  fields: 'Overview,Genres,People,MediaStreams,Studios,CommunityRating,CriticRating,OfficialRating,ProductionYear,RunTimeTicks,Path,Container',
};

// --- DATA MODEL ---
let allMovies = [];
let filteredMovies = [];
let synopses = {};
let sortCol = 'title';
let sortDir = 'asc';
let expandedId = null;
let hoverCardEnlarged = false;

// --- API ---
async function fetchMovies() {
  const url = `${CONFIG.serverUrl}/Items?IncludeItemTypes=Movie&Recursive=true&Fields=${CONFIG.fields}&StartIndex=0&Limit=10000&api_key=${CONFIG.apiKey}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`API error: ${resp.status}`);
  const data = await resp.json();
  return data.Items.map(parseMovie);
}

async function fetchSynopses() {
  try {
    const resp = await fetch('synopses.json');
    if (resp.ok) return await resp.json();
  } catch (e) { /* synopses are optional */ }
  return {};
}

function thumbnailUrl(id, height = 40) {
  if (!id) return '';
  return `${CONFIG.serverUrl}/Items/${id}/Images/Primary?maxHeight=${height}&quality=80&api_key=${CONFIG.apiKey}`;
}

function rtLabel(criticRating) {
  if (criticRating == null || criticRating === 0) return '';
  const pct = Math.round(criticRating);
  return pct >= 60 ? `${pct}% Fresh` : `${pct}% Rotten`;
}

function parseMovie(item) {
  const videoStream = (item.MediaStreams || []).find(s => s.Type === 'Video') || {};
  const audioStream = (item.MediaStreams || []).find(s => s.Type === 'Audio') || {};
  const directors = (item.People || []).filter(p => p.Type === 'Director').map(p => p.Name);
  const actors = (item.People || []).filter(p => p.Type === 'Actor').map(p => p.Name);
  const height = videoStream.Height || 0;
  const width = videoStream.Width || 0;
  const bitrate = videoStream.BitRate || 0;

  let resolution = 'SD';
  if (height >= 2160 || width >= 3840) resolution = '4K';
  else if (height >= 1080 || width >= 1920) resolution = '1080p';
  else if (height >= 720 || width >= 1280) resolution = '720p';

  const audioChannels = audioStream.Channels || 0;
  let audioLabel = 'Unknown';
  if (audioChannels >= 8) audioLabel = '7.1';
  else if (audioChannels >= 6) audioLabel = '5.1';
  else if (audioChannels >= 2) audioLabel = 'Stereo';
  else if (audioChannels === 1) audioLabel = 'Mono';

  const runtimeMin = item.RunTimeTicks ? Math.round(item.RunTimeTicks / 600000000) : 0;

  // Estimate file size from bitrate and runtime (rough)
  const totalBitrate = (videoStream.BitRate || 0) + (audioStream.BitRate || 0);
  const durationSec = item.RunTimeTicks ? item.RunTimeTicks / 10000000 : 0;
  const sizeBytes = (totalBitrate * durationSec) / 8;

  return {
    id: item.Id,
    title: item.Name || 'Unknown',
    year: item.ProductionYear || 0,
    director: directors.join(', ') || '—',
    genres: (item.Genres || []),
    genre: (item.Genres || []).join(', ') || '—',
    rating: item.CommunityRating || 0,
    criticRating: item.CriticRating || 0,
    officialRating: item.OfficialRating || '—',
    runtime: runtimeMin,
    resolution: resolution,
    resHeight: height,
    audio: audioLabel,
    audioCodec: (audioStream.Codec || '?').toUpperCase(),
    audioChannels: audioChannels,
    codec: (videoStream.Codec || '?').toUpperCase(),
    sizeBytes: sizeBytes,
    size: formatSize(sizeBytes),
    overview: item.Overview || 'No overview available.',
    cast: actors.slice(0, 8),
    studios: (item.Studios || []).map(s => s.Name),
    path: item.Path || '',
    container: item.Container || '',
  };
}

function formatSize(bytes) {
  if (!bytes || bytes <= 0) return '—';
  if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + ' GB';
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(0) + ' MB';
  return (bytes / 1024).toFixed(0) + ' KB';
}

// --- SORTING ---
function sortMovies(movies, col, dir) {
  const mult = dir === 'asc' ? 1 : -1;
  return [...movies].sort((a, b) => {
    let va, vb;
    switch (col) {
      case 'title':    va = a.title.toLowerCase(); vb = b.title.toLowerCase(); break;
      case 'year':     va = a.year; vb = b.year; break;
      case 'director': va = a.director.toLowerCase(); vb = b.director.toLowerCase(); break;
      case 'genre':    va = a.genre.toLowerCase(); vb = b.genre.toLowerCase(); break;
      case 'rating':   va = a.rating; vb = b.rating; break;
      case 'runtime':  va = a.runtime; vb = b.runtime; break;
      case 'res':      va = a.resHeight; vb = b.resHeight; break;
      case 'audio':    va = a.audioChannels; vb = b.audioChannels; break;
      case 'codec':    va = a.codec; vb = b.codec; break;
      case 'size':     va = a.sizeBytes; vb = b.sizeBytes; break;
      default:         va = a.title.toLowerCase(); vb = b.title.toLowerCase();
    }
    if (va < vb) return -1 * mult;
    if (va > vb) return 1 * mult;
    return 0;
  });
}

// --- FILTERING ---
function filterMovies(movies) {
  const search = document.getElementById('f-search').value.toLowerCase().trim();
  const genre = document.getElementById('f-genre').value;
  const yearMin = parseInt(document.getElementById('f-year-min').value) || 0;
  const yearMax = parseInt(document.getElementById('f-year-max').value) || 9999;
  const ratingMin = parseFloat(document.getElementById('f-rating').value) || 0;
  const res = document.getElementById('f-res').value;

  return movies.filter(m => {
    if (search) {
      const haystack = (m.title + ' ' + m.director + ' ' + m.cast.join(' ')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    if (genre && !m.genres.includes(genre)) return false;
    if (m.year && (m.year < yearMin || m.year > yearMax)) return false;
    if (m.rating < ratingMin) return false;
    if (res) {
      if (res === '4k' && m.resolution !== '4K') return false;
      if (res === '1080' && m.resolution !== '1080p') return false;
      if (res === '720' && m.resolution !== '720p') return false;
      if (res === 'sd' && m.resolution !== 'SD') return false;
    }
    return true;
  });
}

// --- RENDERING ---
function ratingClass(r) {
  if (r >= 7.5) return 'rating-high';
  if (r >= 5.5) return 'rating-mid';
  return 'rating-low';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderTable() {
  filteredMovies = filterMovies(allMovies);
  filteredMovies = sortMovies(filteredMovies, sortCol, sortDir);

  const stats = document.getElementById('stats');
  stats.textContent = filteredMovies.length === allMovies.length
    ? `${allMovies.length} movies`
    : `${filteredMovies.length} of ${allMovies.length} movies`;

  const tbody = document.getElementById('tbody');
  if (filteredMovies.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="status-msg">No movies match your filters.</td></tr>';
    return;
  }

  const rows = [];
  for (const m of filteredMovies) {
    const rc = ratingClass(m.rating);
    const thumbSrc = thumbnailUrl(m.id, 40);
    rows.push(
      `<tr data-id="${m.id}">` +
      `<td class="thumb-cell"><img src="${thumbSrc}" alt="" loading="lazy" onerror="this.style.display='none'"></td>` +
      `<td class="title-cell" title="${escapeHtml(m.title)}">${escapeHtml(m.title)}</td>` +
      `<td>${m.year || '—'}</td>` +
      `<td title="${escapeHtml(m.director)}">${escapeHtml(m.director)}</td>` +
      `<td title="${escapeHtml(m.genre)}">${escapeHtml(m.genre)}</td>` +
      `<td class="rating-cell ${rc}">${m.rating ? m.rating.toFixed(1) : '—'}</td>` +
      `<td>${m.runtime || '—'}</td>` +
      `<td>${m.resolution}</td>` +
      `<td>${m.audio}</td>` +
      `<td>${m.codec}</td>` +
      `<td>${m.size}</td>` +
      `</tr>`
    );

    if (expandedId === m.id) {
      rows.push(renderDetailRow(m));
    }
  }

  tbody.innerHTML = rows.join('');
}

function renderDetailRow(m) {
  const castList = m.cast.length
    ? m.cast.map(c => `<li>${escapeHtml(c)}</li>`).join('')
    : '<li>No cast info</li>';

  const studioList = m.studios.length
    ? m.studios.map(s => escapeHtml(s)).join(', ')
    : '—';

  const playUrl = `${CONFIG.serverUrl}/web/#/details?id=${m.id}&serverId=${m.id.substring(0, 32)}`;

  return (
    `<tr class="detail-row"><td colspan="11">` +
    `<div class="detail-grid">` +
      `<div class="detail-section">` +
        `<h3>Overview</h3>` +
        `<p>${escapeHtml(m.overview)}</p>` +
        `<h3 style="margin-top:10px">Technical</h3>` +
        `<p>Video: ${m.codec} ${m.resolution} (${m.resHeight}p) · Audio: ${m.audioCodec} ${m.audio} · Size: ${m.size}</p>` +
        `<p>Studio: ${escapeHtml(studioList)} · Rated: ${escapeHtml(m.officialRating)}</p>` +
      `</div>` +
      `<div class="detail-section">` +
        `<h3>Cast</h3>` +
        `<ul>${castList}</ul>` +
      `</div>` +
    `</div>` +
    `<a class="play-btn" href="${CONFIG.serverUrl}/web/#/details?id=${m.id}" target="_blank">▶ Open in Jellyfin</a>` +
    `</td></tr>`
  );
}

function populateGenres() {
  const genreSet = new Set();
  allMovies.forEach(m => m.genres.forEach(g => genreSet.add(g)));
  const select = document.getElementById('f-genre');
  [...genreSet].sort().forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    select.appendChild(opt);
  });
}

// --- HOVER CARD ---
function showHoverCard(movieId, anchorEl) {
  const m = allMovies.find(x => x.id === movieId);
  if (!m) return;

  const card = document.getElementById('hover-card');
  const syn = synopses[movieId];
  const blurb = syn ? syn.blurb : m.overview;
  const rt = rtLabel(m.criticRating);

  document.getElementById('hc-poster').src = thumbnailUrl(m.id, 300);
  document.getElementById('hc-title').textContent = m.title;
  document.getElementById('hc-meta').textContent = [m.year || '', m.officialRating, m.runtime ? m.runtime + ' min' : ''].filter(Boolean).join(' · ');

  const rtEl = document.getElementById('hc-rt');
  if (rt) {
    rtEl.textContent = rt;
    rtEl.className = 'hover-card-rt ' + (m.criticRating >= 60 ? 'fresh' : 'rotten');
    rtEl.style.display = '';
  } else {
    rtEl.style.display = 'none';
  }

  document.getElementById('hc-genres').innerHTML = m.genres.map(g => `<span>${escapeHtml(g)}</span>`).join('');
  document.getElementById('hc-blurb').textContent = blurb;

  const people = [];
  if (m.director && m.director !== '—') people.push('Dir: ' + m.director);
  if (m.cast.length) people.push('Cast: ' + m.cast.slice(0, 4).join(', '));
  document.getElementById('hc-people').textContent = people.join(' · ');

  // Position card near the thumbnail
  const rect = anchorEl.getBoundingClientRect();
  let top = rect.top;
  let left = rect.right + 8;

  // Keep card on screen
  const cardW = hoverCardEnlarged ? 620 : 420;
  const cardH = hoverCardEnlarged ? 460 : 320;
  if (left + cardW > window.innerWidth) left = rect.left - cardW - 8;
  if (top + cardH > window.innerHeight) top = window.innerHeight - cardH - 10;
  if (top < 10) top = 10;

  card.style.top = top + 'px';
  card.style.left = left + 'px';
  card.classList.toggle('enlarged', hoverCardEnlarged);
  card.classList.add('visible');
}

function hideHoverCard() {
  const card = document.getElementById('hover-card');
  card.classList.remove('visible');
  hoverCardEnlarged = false;
  card.classList.remove('enlarged');
}

// --- EVENT HANDLERS ---
function initEvents() {
  // Sort on header click (skip non-sortable columns)
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = 'asc';
      }
      document.querySelectorAll('thead th').forEach(t => t.classList.remove('sort-asc', 'sort-desc'));
      th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      renderTable();
    });
  });

  // Expand/collapse on row click (but not on thumbnail)
  document.getElementById('tbody').addEventListener('click', (e) => {
    if (e.target.closest('.thumb-cell')) return;
    const row = e.target.closest('tr');
    if (!row || row.classList.contains('detail-row')) return;
    const id = row.dataset.id;
    if (!id) return;
    expandedId = expandedId === id ? null : id;
    renderTable();
  });

  // Hover card on thumbnail — desktop: mouseenter/leave
  const tbody = document.getElementById('tbody');
  let hoverTimeout;
  tbody.addEventListener('mouseenter', (e) => {
    const thumb = e.target.closest('.thumb-cell');
    if (!thumb) return;
    const row = thumb.closest('tr');
    const id = row && row.dataset.id;
    if (!id) return;
    clearTimeout(hoverTimeout);
    hoverTimeout = setTimeout(() => showHoverCard(id, thumb), 200);
  }, true);

  tbody.addEventListener('mouseleave', (e) => {
    const thumb = e.target.closest('.thumb-cell');
    if (!thumb) return;
    clearTimeout(hoverTimeout);
    // Delay hide to allow moving to the card
    setTimeout(() => {
      const card = document.getElementById('hover-card');
      if (!card.matches(':hover')) hideHoverCard();
    }, 150);
  }, true);

  // Keep card visible while hovering over it
  const hoverCard = document.getElementById('hover-card');
  hoverCard.addEventListener('mouseleave', hideHoverCard);

  // Mobile: tap on thumbnail toggles card
  tbody.addEventListener('touchstart', (e) => {
    const thumb = e.target.closest('.thumb-cell');
    if (!thumb) { hideHoverCard(); return; }
    e.preventDefault();
    const row = thumb.closest('tr');
    const id = row && row.dataset.id;
    if (!id) return;
    const card = document.getElementById('hover-card');
    if (card.classList.contains('visible') && card.dataset.movieId === id) {
      hideHoverCard();
    } else {
      card.dataset.movieId = id;
      showHoverCard(id, thumb);
    }
  }, { passive: false });

  // Enlarge button
  document.getElementById('hc-enlarge').addEventListener('click', (e) => {
    e.stopPropagation();
    const card = document.getElementById('hover-card');
    hoverCardEnlarged = !hoverCardEnlarged;
    card.classList.toggle('enlarged', hoverCardEnlarged);
  });

  // Filter inputs
  let filterTimeout;
  const filterInputs = document.querySelectorAll('.filters input, .filters select');
  filterInputs.forEach(el => {
    el.addEventListener('input', () => {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(renderTable, 150);
    });
    el.addEventListener('change', renderTable);
  });

  // Keyboard shortcut: Escape clears filters / hides hover card
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      hideHoverCard();
      document.getElementById('f-search').value = '';
      document.getElementById('f-genre').value = '';
      document.getElementById('f-year-min').value = '';
      document.getElementById('f-year-max').value = '';
      document.getElementById('f-rating').value = '';
      document.getElementById('f-res').value = '';
      expandedId = null;
      renderTable();
    }
    // Focus search on / key
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      document.getElementById('f-search').focus();
    }
  });
}

// --- INIT ---
async function init() {
  try {
    const [movies, syn] = await Promise.all([fetchMovies(), fetchSynopses()]);
    allMovies = movies;
    synopses = syn;
    populateGenres();
    initEvents();
    renderTable();
  } catch (err) {
    document.getElementById('tbody').innerHTML =
      `<tr><td colspan="11" class="status-msg error">Failed to load: ${escapeHtml(err.message)}</td></tr>`;
    document.getElementById('stats').textContent = 'Error';
    console.error('JTX init error:', err);
  }
}

// Export for testing (if loaded as module)
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseMovie, sortMovies, filterMovies, formatSize, ratingClass };
}

init();
</script>
